name: Regression

on:
  push:
    branches:
      - main
      - "dev/0.4.0-*"
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check packaged JavaScript syntax
        run: |
          node --check background.js
          node --check content.js
          node --check popup.js
          node --check offscreen.js
      - name: Run dependency-free regression harness
        run: node --test tests/regression.test.mjs
